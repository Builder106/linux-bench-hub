<desc id="diagram-desc">On the first of each month a GitHub Actions workflow runs Phoronix in Ubuntu 26.04, Fedora 44, and Debian 13 containers, and on an Ampere ARM64 host over SSH. Both paths write a composite.xml file per distro. The R parsers turn that file into static writeups, and the Rails app reads the same file for its charts.</desc>
