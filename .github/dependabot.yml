version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/website"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/website"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

