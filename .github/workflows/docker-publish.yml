name: Build and Publish Container Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/linux-bench-hub

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push Docker image with retry
        run: |
          # Build and push with retry logic (similar to capture-benchmarks.yml publish jobs)
          # Using docker buildx build --push directly for multi-arch support
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --context ./website \
              --file ./website/Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --push \
              --tags ${{ steps.meta.outputs.tags }} \
              --labels ${{ steps.meta.outputs.labels }} \
              --cache-from type=gha \
              --cache-to type=gha,mode=max; then
              echo "Build and push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Build/push failed (attempt $attempt) — retrying in $(( (RANDOM % 5) + 1 ))s..."
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "::error::Failed to build and push after 5 attempts."
          exit 1