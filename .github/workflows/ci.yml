name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

  rails:
    name: Rails (lint + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: website

      - name: Ruby syntax check
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            ruby -c "$f" >/dev/null || { echo "::error file=website/$f::Ruby parse error"; fail=1; }
          done < <(find app bin config lib test -name '*.rb' -not -path '*/node_modules/*')
          exit "$fail"

      - name: Ruby dependency audit
        run: gem install bundler-audit && bundle-audit check --update

      - name: Test suite
        run: bundle exec rails test

      - name: Rubocop
        run: bundle exec rubocop --parallel --fail-level warning

  r-syntax:
    name: R syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Parse R scripts
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::parse $f"
            if ! Rscript -e "parse(file = commandArgs(TRUE)[1])" "$f"; then
              echo "::error file=$f::R parse error"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find benchmarks -type f -name '*.R')
          exit "$fail"
