<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Nothing runs here | LinuxBenchHub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/geist-100_900-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root { color-scheme: dark; --ground: #0a0507; --ink: #f0e4e6; --muted: #b09a9e; --line: #5a2228; --w: clamp(84px, 14vw, 120px); --h: calc(var(--w) * 0.866); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ground); color: var(--ink); overflow-x: clip; }
      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: 24px 40px 40px;
        font: 1rem/1.5 "Geist", ui-sans-serif, system-ui, sans-serif;
      }
      a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 0.2em; }
      a:hover { text-decoration-color: currentColor; }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      header { font-size: 0.8125rem; font-weight: 600; }
      header a { text-decoration: none; }
      main { align-self: center; display: grid; gap: 28px; justify-items: start; }
      h1 { margin: 0 0 0 -0.04em; font-size: clamp(2.75rem, 1rem + 6vw, 6.5rem); font-weight: 700; letter-spacing: -0.045em; line-height: 0.92; }
      /* The comb with no userland: three empty cells around an idle kernel. */
      .comb { position: relative; width: calc(var(--w) * 2.5); height: calc(var(--h) * 2); }
      .hex {
        position: absolute; width: var(--w); height: var(--h);
        clip-path: polygon(25.6% 1.2%, 74.4% 1.2%, 99.3% 50%, 74.4% 98.8%, 25.6% 98.8%, 0.7% 50%);
        background: center / 100% 100% no-repeat;
      }
      .empty { background-image: url("/comb/tile-dark.webp"); opacity: 0.45; }
      .kernel { background-image: url("/comb/tile-kernel.webp"); }
      p { max-width: 46ch; margin: 0; color: var(--muted); }
      @media (max-width: 720px) { body { padding: 20px 16px 32px; } }
    </style>
  </head>
  <body>
    <header><a href="/">LinuxBenchHub</a></header>
    <main>
      <h1>Nothing runs here.</h1>
      <div class="comb" aria-hidden="true">
        <span class="hex empty" style="left: 0; top: calc(var(--h) * 0.5)"></span>
        <span class="hex empty" style="left: calc(var(--w) * 0.75); top: 0"></span>
        <span class="hex empty" style="left: calc(var(--w) * 1.5); top: calc(var(--h) * 0.5)"></span>
        <span class="hex kernel" style="left: calc(var(--w) * 0.75); top: var(--h)"></span>
      </div>
      <p>The kernel is up, but no userland answers at this address. <a href="/">Go back to the comb</a> or read every run in <a href="/compare/">the ledger</a>.</p>
    </main>
  </body>
</html>
